[package]
name = "unblock-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# A test-only seam: exposes `serve_duplex_for_test` (and the otherwise-private `UnblockServer`) so
# the in-process MCP lifecycle test can drive the real server over an in-memory duplex transport.
# Never enabled in a shipped build — it is enabled only by this crate's own integration tests.
test-util = []

[dependencies]
unblock-engine = { workspace = true }
unblock-render = { workspace = true }
unblock-policy = { workspace = true }
# Tool I/O embeds the §1.10 contract DTOs and StructuredError directly (mcp plan §10) —
# declared here rather than relied on transitively via engine's re-exports.
unblock-model = { workspace = true }
unblock-error = { workspace = true }
rmcp = { workspace = true }
# The cooperative-shutdown token for rmcp's `serve_with_ct` (FR-17). rmcp re-exports nothing for it.
tokio-util = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
snafu = { workspace = true }

[dev-dependencies]
# Self dev-dependency that enables the `test-util` feature for the integration tests ONLY (the
# standard cargo idiom): `cargo test` then sees `serve_duplex_for_test`/`UnblockServer` without the
# shipped build (which has `test-util` off) exposing them. The lib + its tests link the same crate.
unblock-mcp = { path = ".", features = ["test-util"] }
# The integration tests (`tests/lifecycle.rs` M2 exit-gate, `tests/error_mapping.rs`) drive a real
# in-memory `Session` over a temp libsql backend — the same construction the engine tests use
# (LibsqlStorage::open_in_memory -> migrate -> Arc<dyn Storage>; WorkspaceContext; Session::open).
unblock-storage = { workspace = true }
unblock-config = { workspace = true }
# The in-process MCP lifecycle test (`tests/lifecycle.rs`) drives an in-memory `tokio::io::duplex`
# client against the server, so it needs the rmcp `client` feature (in addition to the runtime
# `server`/`transport-io`). NEVER the `local` feature (it drops Send+Sync from ServerHandler).
rmcp = { workspace = true, features = ["client"] }
insta = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# The hash-coupled CONTRACT_VERSION drift gate (tests/contract_suite.rs, D22/D25) computes a SHA-256
# digest of the two-document tuple `(capabilities(), schema_bundle())` and asserts it equals the pinned
# `CONTRACT_HASH` — so a contract edit FORCES a version bump (not a silent golden re-bless). Test-only:
# the shipped binary never hashes.
sha2 = { workspace = true }
# The NFR-18 quota AC suite (`tests/quotas.rs`) wraps storage in a `RecordingStorage` spy that
# implements the async `Storage` trait — test-only, never linked into the shipped binary.
async-trait = { workspace = true }
