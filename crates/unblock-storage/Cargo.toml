[package]
name = "unblock-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# T0.5 — interface-only crate: the backend-free `Storage` trait, the storage-owned value
# types (`DeletePlan`/`DeleteMode`/`IssuePatch`), and `StorageError`. The libsql backend
# (`LibsqlStorage`), `petgraph`, the `remote`/`testkit` features, and their TLS/network surface
# are added at T0.6 (see `docs/plans/crates/unblock-storage.md` §3.1, T0.5↔T0.6 boundary).
# Keeping the manifest trimmed makes the no-TLS/no-network default-feature property hold
# trivially and avoids building libsql's bundled SQLite for an interface-only crate.
[dependencies]
unblock-model = { workspace = true }
unblock-error = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
snafu = { workspace = true }
# JSON values for the `CodedError::context()` payloads (no backend; serde_json::Map/Value only).
serde_json = { workspace = true }

[dev-dependencies]
# Drives the `Arc<dyn Storage>` coercion / object-safety test (`#[tokio::test]`).
tokio = { workspace = true }

[features]
default = []
# Empty seam marker reserving the non-default `remote` name (D15). The engine forwards
# `remote = ["unblock-storage/remote"]` to it, so the passthrough must resolve. T0.6 fills this
# with the libsql remote/replica + `backon`/`failsafe` deps; in T0.5 it is a no-op (the
# no-TLS/no-network default-feature property still holds — an empty feature pulls nothing).
remote = []
