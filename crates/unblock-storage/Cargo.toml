[package]
name = "unblock-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# T3.2/C5 (FR-17/NFR-5) test-only helper binary: drives RAW libsql (the crate's existing private
# backend dep below — NO new dep) to hold an UNCOMMITTED `BEGIN IMMEDIATE` tx open (source under
# `tests/bin/`, never `src/` — it never ships via `dist`; the shipped `unblock-storage` lib is
# unaffected). Located from `tests/shutdown_abandoned_tx.rs` via `env!("CARGO_BIN_EXE_c5_abandoned_tx")`
# (the same `CARGO_BIN_EXE` idiom `assert_cmd::cargo_bin` uses in the cli suite).
[[bin]]
name = "c5_abandoned_tx"
path = "tests/bin/c5_abandoned_tx.rs"

# AC-1 (D31/T3.4.1) test-only helper: ONE process in the cross-process `.write.lock` race, located
# from `tests/write_lock_two_process.rs` via `env!("CARGO_BIN_EXE_write_lock_race")`. Source under
# `tests/bin/` (never `src/`) — it never ships via `dist`; uses only the crate's public API + existing
# deps (unblock-model/chrono/tokio), NO new dep.
[[bin]]
name = "write_lock_race"
path = "tests/bin/write_lock_race.rs"

# L2 — the backend-free `Storage` trait + the only backend-aware impl (libsql).
# `libsql` and `petgraph` are PRIVATE deps (no backend/graph type in any public signature,
# spine §6 rule 2). The default build is local file / bundled SQLite only (no TLS, no
# network — RK-4): `libsql` is pulled with `features = ["core"]` (which statically bundles
# SQLite) and `default-features = false`. The `remote`/replica path stays behind the
# non-default `remote` feature (D15/NFR-10).
[dependencies]
unblock-model = { workspace = true }
unblock-error = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
snafu = { workspace = true }
# JSON values for the `CodedError::context()` payloads (no backend; serde_json::Map/Value only).
serde_json = { workspace = true }
# Backend: local file / bundled SQLite by default; remote/replica behind the `remote` feature.
libsql = { workspace = true }
# Private: backs `detect_cycles` / cycle-path detection / dependency tree. No petgraph type in
# any public signature (spine §6 rule 2).
petgraph = { workspace = true }
# The serialized write-connection guard (`tokio::sync::Mutex`); the trait is async throughout.
tokio = { workspace = true }

[dev-dependencies]
# Drives the `#[tokio::test]` async tests (object-safety coercion, in-memory round-trips,
# concurrent-claim contention).
tokio = { workspace = true }
# Column-order / index-list / ErrorCode golden snapshots.
insta = { workspace = true }
# Row<->domain round-trip + invariant property tests.
proptest = { workspace = true }
# Temp-file DB for the file-backed leg of the NFR-16 contract suite (`tests/contract.rs`) and the
# T0.8 contention lab.
tempfile = { workspace = true }
# Whole-process CPU time (all tokio worker threads) for the T0.8 contention lab's baseline-relative
# CPU-per-write ratio (NFR-3 / RK-1). Unsafe-free (no raw libc); test-only.
cpu-time = { workspace = true }
# NFR-1 HYBRID perf gate (T3.5/D34): the FIRST `async_tokio` criterion bench in the repo
# (`benches/storage.rs`). Already declared workspace-wide (root Cargo.toml, `features=[async_tokio]`),
# unused until now; adds no NEW transitive surface.
criterion = { workspace = true }

# NFR-1 storage perf gate (T3.5/D34): create/list/ready/count/search over a file-backed libsql DB.
# `harness = false` → criterion owns `main`. The bench BODY is `#[cfg(feature = "testkit")]` (it needs
# `testkit::seed_corpus`); without the feature the target compiles to an empty `main`, so
# `cargo test/clippy --workspace` (no testkit) still builds it clean. Run it via
# `cargo bench -p unblock-storage --features testkit`.
[[bench]]
name = "storage"
harness = false

[features]
default = []
# Non-default `remote`/replica seam (D15). The engine forwards
# `remote = ["unblock-storage/remote"]`, so the passthrough must resolve. T0.6 keeps this an
# empty marker (the remote/replica `remote.rs` lands at v1.3 with the libsql remote/replica +
# `backon`/`failsafe` deps); an empty feature pulls nothing, so the no-TLS/no-network
# default-feature property still holds.
remote = []
# Exposes the backend-independent NFR-16 contract suite (`testkit::run_storage_contract_suite`) and
# the gated `StorageTestkit` seam so a future backend (roadmap v2+) reuses the same proof. The seam
# is also `#[cfg(test)]`-active, so the in-crate `tests/contract.rs` runs without the flag; the
# feature is what lets the out-of-crate fuzz crate reach it. Pulls nothing extra (no deps).
testkit = []
