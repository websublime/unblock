[package]
name = "unblock-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

# AC-1 / M1 (D31/T3.4.1) test-only helper: ONE process driving the REAL engine `Session::create_issue`
# in the cross-process `.write.lock` race, located from `tests/engine_write_lock_two_process.rs` via
# `env!("CARGO_BIN_EXE_engine_write_lock_race")`. Source under `tests/bin/` (never `src/`) — it never
# ships via `dist`; uses only the crate's own lib + existing `[dependencies]` (config/storage/model +
# tokio/async-trait/chrono), NO new dep.
[[bin]]
name = "engine_write_lock_race"
path = "tests/bin/engine_write_lock_race.rs"

[dependencies]
unblock-config = { workspace = true }
unblock-storage = { workspace = true }
unblock-policy = { workspace = true }
unblock-model = { workspace = true }
unblock-error = { workspace = true }
# `sync`/`health` are composed behind default-on features (engine plan §Cargo.toml).
unblock-sync = { workspace = true, optional = true }
unblock-health = { workspace = true, optional = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }
# `init_tracing` (engine plan `src/logging.rs`) installs the `unblock.reliability` subscriber
# (NFR-13). Already in the workspace lock; adds no NEW transitive surface to the default build.
tracing-subscriber = { workspace = true }
serde = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
# NOTE (OQ-4 RESOLVED): the OS signal handler install lives in `unblock-cli` (L7); the engine
# only reads the cooperative shutdown flag. The engine therefore takes NO `signal-hook` dep.

[features]
default = ["sync", "health"]
sync = ["dep:unblock-sync"]
health = ["dep:unblock-health"]
# D15: forwards only to storage's non-default remote/replica path.
remote = ["unblock-storage/remote"]
# T3.5/D34: forwards to storage's `testkit` so `benches/engine.rs` + `tests/scale.rs` can seed the
# NFR-1/NFR-2 corpus via `unblock_storage::testkit::seed_corpus` (storage-direct, non-minted — F-2).
# Off by default; enabled only by the CI `bench-gate`/`scale` jobs
# (`cargo bench -p unblock-engine --features testkit` / `--test scale`), so a plain
# `cargo test --workspace` builds the bench to an empty `main` and `tests/scale.rs` to zero tests.
# storage `testkit` pulls NO deps, so this adds no transitive surface (RK-4 holds).
testkit = ["unblock-storage/testkit"]

[dev-dependencies]
# The tests drive the REAL libsql storage (no `Storage` mock — FR-9 "identical behaviour through
# one path"): a `#[cfg(test)]` `Session` ctor over `LibsqlStorage::open_in_memory` + temp `.unblock/`
# workspaces via `unblock_config::open_with_storage`.
unblock-storage = { workspace = true }
unblock-config = { workspace = true }
unblock-model = { workspace = true }
unblock-error = { workspace = true }
unblock-policy = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
# The `ParkedStorage` decorator (tests/common) impls the async `Storage` trait to park a write
# mid-tx (FR-10 read-during-write + D14 cancel-safety) — real storage delegation, not a mock.
async-trait = { workspace = true }
# The `error_contract.rs` golden constructs a `SyncError` to pin the new `EngineError::Sync` row
# (the `#[cfg(feature="sync")]` case). Default-on `sync` makes it a dev-dep for the test binary.
unblock-sync = { workspace = true }
# Likewise the `error_contract.rs` golden constructs a `HealthError` to pin the `EngineError::Health`
# row (the `#[cfg(feature="health")]` case, T3.3/D29); the `lifecycle.rs` doctor-mapping unit test
# constructs a `DoctorReport` via `run_doctor`. Default-on `health` makes it a dev-dep too.
unblock-health = { workspace = true }
# FR-9 linearizability property test + the write-permit single-occupancy invariant.
proptest = { workspace = true }
# Golden `EngineError -> ErrorCode -> exit_code` map (FR-11) + diagnostics-per-kind snapshots.
insta = { workspace = true }
serde_json = { workspace = true }
# Temp `.unblock/` workspaces for the config-facade harness path.
tempfile = { workspace = true }
# NFR-1 HYBRID engine-overhead perf gate (T3.5/D34): `benches/engine.rs`. Already declared
# workspace-wide (root Cargo.toml, `features=[async_tokio]`); adds no NEW transitive surface.
criterion = { workspace = true }

# NFR-1 engine perf gate (T3.5/D34): export/import (10k) + create/ready/list/claim engine overhead
# vs the storage budgets. `harness = false` → criterion owns `main`. The bench BODY is
# `#[cfg(feature = "testkit")]` (it needs `unblock_storage::testkit::seed_corpus` for export/import);
# without the feature the target compiles to an empty `main`, so `cargo test`/`clippy --workspace`
# (no testkit) stay green. Run via `cargo bench -p unblock-engine --features testkit`.
[[bench]]
name = "engine"
harness = false
