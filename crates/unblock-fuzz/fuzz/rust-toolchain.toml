# Pin the nightly used ONLY for libFuzzer sanitizer codegen (this nested package needs it). This is
# a SCOPED toolchain file: it applies only inside `crates/unblock-fuzz/fuzz/`, never to the workspace
# root (which stays on stable 1.96.0, NFR-12). The library crates never compile under this channel.
#
# The channel MUST be >= the workspace's stable target (1.96): the `unblock-*` dep tree is edition 2024
# (stabilized 1.85) and uses let-chains (stabilized 1.88), so an older nightly (e.g. the former
# `nightly-2024-10-31` = cargo 1.84) cannot even parse it. `nightly-2026-04-01` = rustc 1.96.0-nightly,
# aligned with the root stable 1.96 pin.
[toolchain]
channel = "nightly-2026-04-01"
components = ["rustfmt", "clippy"]
