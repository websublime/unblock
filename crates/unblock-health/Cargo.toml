[package]
name = "unblock-health"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Storage-free (D29 clause F3, kept by D58 clause (4)): the engine gathers every fact and passes it in
# as data, so health never holds a `Storage` handle nor names a libsql type (NFR-15). No tokio, no
# chrono, no git, no network. `unblock-sync` supplies the one conflict-marker scanner (`scan_export`);
# `sha2` hashes the recovery run-directory copies and names run directories; `tracing` carries the
# NFR-13 audit record on `unblock.reliability`. The layering matrix (`xtask/src/layering.rs`) pins
# the edges.
unblock-model = { workspace = true }
unblock-error = { workspace = true }
unblock-sync = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Fixtures materialize workspace files and recovery roots on disk.
tempfile = { workspace = true }
# Invariants: composite level == max; integrity-row and file-state classifiers are total.
proptest = { workspace = true }
# JSON snapshots pin HealthLevel and the D58 class table (NFR-14).
insta = { workspace = true }
# The audit capture cell installs a scoped `tracing_subscriber::Layer` (the D30 dep-free capture
# approach `unblock-sync`'s `reliability_tracing.rs` uses) and asserts the four field values.
tracing-subscriber = { workspace = true }
