# golangci-lint configuration for the unblock backend (apps/api/).
#
# Invocation: `cd apps/api && golangci-lint run --max-warnings 0`
# (per SPEC §11.2 NFR-10).
#
# Custom linter wiring:
#
# Two project-local analyzers live at apps/api/shared/lint/. Both are
# consumed via the module-plugin system carried into golangci-lint v2.x
# (see https://golangci-lint.run/plugins/module-plugins/ and the v2
# migration guide at https://golangci-lint.run/usage/migration-guide/):
#
#   - no_direct_is_ready_write — rejects UPDATE statements writing
#     workitems.items.is_ready or pipeline_stage outside the cascade
#     subscriber package (SPEC §11.3, unblock-tv8.4).
#   - no_rbac_dynamic_clause — rejects runtime-constructed string
#     arguments to rbac.ScopedQuery.Where (clause, arg index 0) AND
#     rbac.For (table, arg index 1); both MUST be a Go string literal
#     or untyped string constant (SPEC §10.1, unblock-tv8.33,
#     unblock-tv8.35). The file/registration name retains the
#     historical "clause" suffix; the analyzer's authoritative scope
#     covers both call shapes.
#
# Operators who want the custom linters to participate in CI must:
#
#   1. Build a custom golangci-lint binary that includes BOTH analyzer
#      modules (a single .custom-gcl.yml registers the whole module).
#      The `version:` field below pins the BUILT BINARY version (the
#      tag of golangci-lint to compile against) — NOT the config-file
#      schema version (that is the top-level `version: "2"` declared
#      below, line 65). The two must remain consistent: a v2 schema
#      requires a v2 binary.
#
#        cd apps/api
#        cat > .custom-gcl.yml <<'EOF'
#        version: v2.5.0
#        plugins:
#          - module: encore.app
#            path: ./shared/lint
#        EOF
#        golangci-lint custom
#
#   2. Use the resulting `./custom-gcl` binary in CI in place of the
#      stock `golangci-lint`. Olive (infra-supervisor) wires this into
#      the GitHub Actions workflow under bead A-6 (unblock-tv8.6); the
#      exact v2 tag installed in the GHA runner image MUST match the
#      `version:` pin above.
#
# Local developers: this config requires golangci-lint v2.x. If your
# local binary is v1.x (`golangci-lint --version` reports v1.*), upgrade
# via `brew upgrade golangci-lint` (or your package manager equivalent)
# before running the gate. Go 1.26+ source is not reliably typecheckable
# under v1.x.
#
# Local development without a custom binary is still useful: every
# core linter below runs against the standard golangci-lint binary,
# and each analyzer is independently runnable via:
#
#   cd apps/api && go run ./shared/lint/cmd/no_direct_is_ready_write ./...
#   cd apps/api && go run ./shared/lint/cmd/no_rbac_dynamic_clause ./...
#
# The custom linter section below is therefore declared but only
# consumed when a custom-built binary loads it.

version: "2"

run:
  timeout: 5m
  tests: true
  # Exclude analysistest fixtures: they intentionally contain forbidden
  # SQL strings and are not part of the production build.
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    custom:
      no_direct_is_ready_write:
        type: module
        description: |
          Rejects UPDATE statements writing workitems.items.is_ready or
          pipeline_stage outside encore.app/deps (the cascade subscriber
          package). See SPEC §11.3 lines 2034-2037.
        original-url: encore.app/shared/lint
      no_rbac_dynamic_clause:
        type: module
        description: |
          Rejects runtime-constructed string arguments to
          rbac.ScopedQuery.Where (clause, arg 0) AND rbac.For (table,
          arg 1); both MUST be a Go string literal or untyped string
          constant. Runtime values destined for Where flow through
          args...; the table identifier of For has no runtime channel
          (SQL identifiers cannot be bound). See SPEC §10.1 /
          unblock-tv8.33 / unblock-tv8.35.
        original-url: encore.app/shared/lint
  exclusions:
    rules:
      # analysistest fixtures intentionally contain the forbidden
      # pattern; they must not trigger the linter against themselves.
      - path: shared/lint/testdata/
        linters:
          - all
      # rbac unit tests probe internal helpers; the test file uses
      # patterns (deliberate zero-value, naked literals) that some
      # linters flag.
      - path: shared/rbac/rbac_test.go
        text: "(unused|deadcode)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
