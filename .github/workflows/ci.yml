# unblock — CI quality gate (from M0). See docs/plans/ci-cd-and-distribution.md §2.
#
# Runs on every PR and on pushes to the default branch. All jobs build on stable 1.96.0 (D9/NFR-12).
# Every `uses:` is pinned to a 40-char commit SHA with a trailing `# vX.Y.Z` (NFR-9).
#
# This file defines the 10 always-on M0 jobs (ci-cd §2): fmt, clippy, test, storage-testkit,
# snapshots, layering, doc-lint, toolchain, audit, deny. The 11th M0 job — `fuzz-smoke` — runs on a
# nightly schedule in `fuzz-smoke.yml` (it also runs the two #[ignore]d contention-lab controls).
#
# The reliability half of the deferred ledger is a FIVE-job split (ci-cd §2). FOUR land here:
#   - stress-integrity → T3.4 (NFR-5) — LANDED BELOW: the long-lived + interleaved engine integrity
#     tests at a MODEST corpus + the `unblock-sync --features fault-injection` (NFR-4) clippy+test leg.
#   - bench-gate → T3.5 (NFR-1) — LANDED BELOW: the HYBRID perf gate (D34) — `cargo bench` on the
#     storage/engine/policy/render criterion suites (targeted `--features testkit`, never
#     `--all-features`) + the absolute-ceiling compare `cargo xtask bench-gate`.
#   - scale → T3.5 (NFR-2) — LANDED BELOW: the storage-direct 250k `tests/scale.rs` (storage + engine).
#   - rate-limit → T3.5 (P2) (NFR-18) — LANDED BELOW: the `RateLimited` mint + `Arc<Semaphore>`
#     chokepoint AC (`tests/rate_limit.rs`); a cheap independent `-p unblock-mcp` leg — NOT riding the
#     perf/scale corpus.
# The dist release pipeline (T3.6) adds THREE jobs, ALL landed as of T3.6 (deferred ledger now empty):
#   - verify-pins → T3.6 (P1) (NFR-9) — LANDED BELOW: `cargo xtask verify-pins` fails if any third-party
#     `uses:` in `.github/workflows/*.yml` is not pinned to a 40-char SHA (backstops the standing
#     NFR-9 re-pin duty; `dist` CLOBBERS the pins in the generated `release.yml` on every regen).
#   - no-network → T3.6 (P2) (NFR-17) — LANDED BELOW: `cargo xtask no-network` source-scans all
#     `crates/*/src` + `xtask/src` and fails on an un-gated network symbol outside the whitelisted
#     `self-update` axoupdater path (the crate-scoped tripwire `no_git_gate.rs` from T3.1/D27 stays as a
#     fast per-crate check; this is the workspace-wide realization of the same gate).
#   - feature-matrix → T3.6 (P2) (NFR-10/NFR-17) — LANDED BELOW: `cargo build -p unblock-cli
#     --no-default-features` (the AUTHORITATIVE confinement proof — axoupdater/reqwest/hyper unreachable
#     when `self-update` is off) + the default-on leg + cargo-tree (dis)appearance controls.
#
# Feature policy (D15/NFR-10, ci-cd §2.2): the testkit clippy/test steps use TARGETED features
# (`-p unblock-storage --features testkit`), never `--all-features` — `--all-features` resolves the
# libsql `remote` TLS stack (reqwest/hyper/rustls) which must stay off the M0 gate.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (storage testkit — feature-gated code is lint-clean)
        run: cargo clippy -p unblock-storage --all-targets --features testkit --locked -- -D warnings
      - name: clippy (engine testkit — feature-gated code is lint-clean)
        run: cargo clippy -p unblock-engine --all-targets --features testkit --locked -- -D warnings

  test:
    name: test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # The always-on unit + proptest + behaviour.rs set. The testkit-gated contract.rs /
      # contention_lab.rs are `#![cfg(feature = "testkit")]` and compile to 0 tests here — they run
      # in the dedicated `storage-testkit` job.
      - run: cargo test --workspace --locked

  storage-testkit:
    name: storage testkit (NFR-16 contract + NFR-3 contention)
    # ubuntu-latest provides >= 2 vCPU; the contention gate hard-fails on a single-vCPU runner
    # (writers cannot genuinely contend there).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: assert >= 2 vCPU (contention gate precondition)
        run: |
          n="$(nproc)"
          echo "available vCPU: ${n}"
          if [ "${n}" -lt 2 ]; then
            echo "::error::contention lab needs >= 2 vCPU; runner has ${n}" >&2
            exit 1
          fi
      - name: NFR-16 Storage contract suite
        run: cargo test -p unblock-storage --features testkit --locked --test contract
      - name: NFR-3 contention lab (M0 gate)
        run: cargo test -p unblock-storage --features testkit --locked --test contention_lab

  stress-integrity:
    name: stress-integrity (NFR-5 long-lived/interleaved + NFR-4 fault-injection)
    # T3.4/D30 (ci-cd §2). ubuntu-latest provides >= 2 vCPU; the interleaved/long-lived engine tests
    # run on a multi-thread tokio runtime and cannot genuinely contend on a single-vCPU runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: assert >= 2 vCPU (concurrency precondition)
        run: |
          n="$(nproc)"
          echo "available vCPU: ${n}"
          if [ "${n}" -lt 2 ]; then
            echo "::error::the interleaved/long-lived integrity tests need >= 2 vCPU; runner has ${n}" >&2
            exit 1
          fi
      # NFR-5 gate (c)+(d): the long-lived single-workspace stress + interleaved command-family
      # integrity tests, at the DEFAULT-CI size (the #[ignore]d 10^4 soak runs on demand, not here).
      - name: NFR-5 stress + interleaving (integrity-only)
        run: cargo test -p unblock-engine --locked --test stress_longlived --test interleaved_families
      # NFR-4 export fault-injection seam — a TARGETED feature leg (NEVER --all-features, which pulls
      # the libsql remote TLS stack, D15/NFR-10). Clippy proves the feature-gated seam is lint-clean.
      - name: NFR-4 fault-injection (clippy)
        run: cargo clippy -p unblock-sync --all-targets --features fault-injection --locked -- -D warnings
      - name: NFR-4 fault-injection (per-stage seam tests)
        run: cargo test -p unblock-sync --features fault-injection --locked --test atomic_failure

  bench-gate:
    name: bench-gate (NFR-1 hybrid perf gate)
    # T3.5/D34 (ci-cd §2). The absolute per-PR ceiling is asserted on a pinned >= 2-vCPU runner (the
    # `storage-testkit` precedent) so the generous budgets are portable (D34/F-1). The advisory
    # relative-10% delta is a SEPARATE nightly leg (never a per-PR gate) and is not run here.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: assert >= 2 vCPU (perf-gate runner precondition)
        run: |
          n="$(nproc)"
          echo "available vCPU: ${n}"
          if [ "${n}" -lt 2 ]; then
            echo "::error::the NFR-1 perf gate needs >= 2 vCPU; runner has ${n}" >&2
            exit 1
          fi
      # Run the four gated criterion suites — TARGETED features (`--features testkit` for the
      # storage/engine corpus seeder), NEVER `--all-features` (which resolves the libsql `remote` TLS
      # stack, ci-cd §2.2). Each writes `target/criterion/**/estimates.json`.
      # Freshness guard (SF-B): purge any cached criterion output so the bench-gate REQUIRED-benches
      # guard cannot be satisfied by a stale `new/estimates.json` from a prior run (a deleted/renamed
      # required bench must fail, not silently pass on cached data).
      - name: purge stale criterion output
        run: rm -rf target/criterion
      - name: bench storage (NFR-1)
        run: cargo bench -p unblock-storage --features testkit --locked --bench storage
      - name: bench engine (NFR-1)
        run: cargo bench -p unblock-engine --features testkit --locked --bench engine
      - name: bench policy (NFR-1, F-7)
        run: cargo bench -p unblock-policy --locked --bench policy
      - name: bench render (NFR-1, F-7)
        run: cargo bench -p unblock-render --locked --bench render
      # The hard tier-ii gate: fail if any measured mean exceeds its absolute ceiling (D34).
      - name: bench-gate absolute-ceiling compare
        run: cargo xtask bench-gate
      # Record-only round-trip baseline (D34/F-4) — `#[ignore]`d, run here with `--nocapture` so the
      # p50/p99 line is visible in the CI log (never a gate; a failure here means the MCP loop broke).
      - name: round-trip baseline (ready->claim->close p50/p99, record-only)
        run: cargo test -p unblock-cli --test mcp_round_trip --locked -- --ignored --nocapture

  scale:
    name: scale (NFR-2 250k corpus)
    # T3.5/D34 (ci-cd §2). ubuntu-latest provides >= 2 vCPU; the 250k seed + reads run on a
    # multi-thread tokio runtime. An explicit timeout bounds a runaway seed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: assert >= 2 vCPU (scale runner precondition)
        run: |
          n="$(nproc)"
          echo "available vCPU: ${n}"
          if [ "${n}" -lt 2 ]; then
            echo "::error::the 250k scale test needs >= 2 vCPU; runner has ${n}" >&2
            exit 1
          fi
      # The storage-direct, validated-but-non-minted 250k corpus (D34/F-2). TARGETED `--features
      # testkit` (never `--all-features`). The `#[ignore]`d 1M soak variant is NOT run here.
      - name: NFR-2 storage scale (250k read budgets + integrity)
        run: cargo test -p unblock-storage --features testkit --locked --test scale
      - name: NFR-2 engine scale (250k read budgets + integrity)
        run: cargo test -p unblock-engine --features testkit --locked --test scale

  rate-limit:
    name: rate-limit (NFR-18 Arc<Semaphore> chokepoint)
    # T3.5/D34 (P2, ci-cd §2). A cheap INDEPENDENT `-p unblock-mcp` leg — does NOT ride the perf/scale
    # 250k corpus. The concurrency cap is core-independent, but the N/N+1 AC runs on a multi-thread
    # tokio runtime (needs >= 2 worker threads); ubuntu-latest provides them. `-p unblock-mcp` pulls the
    # self dev-dep `features = ["test-util"]` that exposes `mcp_server_duplex_for_test`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: NFR-18 rate-limit AC (chokepoint + SF-6 macro-suppression pin)
        run: cargo test -p unblock-mcp --locked --test rate_limit

  snapshots:
    name: snapshots (insta --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install cargo-insta
        run: cargo install cargo-insta --version 1.48.0 --locked
      - run: cargo insta test --check --workspace

  layering:
    name: layering (NFR-15 acyclic graph)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # Reads the committed Cargo.lock so `cargo metadata --offline` resolves (no lock regen).
      - run: cargo xtask check-layering

  doc-lint:
    name: doc-lint (doc-corpus consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo xtask doc-lint
      # D43 zero-live-hits: no doc may still claim the argument boundary is safe without naming the
      # duplicate-key scan, and no doc may still frame that class as open. A predicate, not a count —
      # it also self-tests that every allow-list entry still matches something.
      - run: scripts/checks/d43-argument-boundary-claims.sh
      # k1..k6: .knowledge structural lint — SEPARATE corpus from the 19-file normative lint (ci-cd §2.3)
      - run: cargo xtask knowledge-lint
      # Executable proof of the shared gate predicate — every rule arm, exits 0/1/2.
      - run: scripts/knowledge/tests/run-report-gate-selftest.sh

  verify-pins:
    name: verify-pins (NFR-9 action SHA-pinning)
    # T3.6/D4 (ci-cd §2). Fails if any third-party `uses:` in `.github/workflows/*.yml` is not pinned
    # to a 40-char commit SHA — backstops the standing NFR-9 re-pin duty (`dist` CLOBBERS the pins in
    # `release.yml` on every regen; the floating `actions/attest@v4` in dist's template is the risk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo xtask verify-pins

  no-network:
    name: no-network (NFR-17 workspace-wide network confinement)
    # T3.6/D5 (P2, ci-cd §2 / §5 NFR-17). Source-scans all crates/*/src + xtask/src and fails if a
    # networking symbol (reqwest/hyper/std::net/TcpStream/rustls/un-gated axoupdater) appears outside the
    # whitelisted self-update axoupdater path in unblock-cli. Workspace-wide realization of the T3.1
    # crate-scoped tripwire (no_git_gate.rs). The AUTHORITATIVE confinement proof is `feature-matrix`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo xtask no-network

  feature-matrix:
    name: feature-matrix (NFR-10/NFR-17 self-update confinement)
    # T3.6/D6 (P2, ci-cd §2). The AUTHORITATIVE confinement proof: with `self-update` OFF the crate
    # compiles, so axoupdater/reqwest/hyper are provably unreachable un-gated; the default-on leg proves
    # they return. cargo-tree controls scope to `--edges normal` (dev-deps like wiremock legitimately
    # pull reqwest; only runtime edges constrain confinement).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: build without self-update (axoupdater/reqwest/hyper unreachable — AUTHORITATIVE proof)
        run: cargo build -p unblock-cli --no-default-features --locked
      - name: control — no network crate resolves without self-update (runtime edges only)
        run: |
          tree="$(cargo tree -p unblock-cli --no-default-features --edges normal --locked)"
          echo "$tree"
          if echo "$tree" | grep -Eiq 'reqwest|hyper|axoupdater|rustls'; then
            echo "::error::a network crate resolved with --no-default-features (self-update off)" >&2
            exit 1
          fi
      - name: build with self-update (default-on leg)
        run: cargo build -p unblock-cli --locked
      - name: control — network crates DO return with self-update (runtime edges only)
        run: |
          tree="$(cargo tree -p unblock-cli --features self-update --edges normal --locked)"
          echo "$tree"
          echo "$tree" | grep -q axoupdater \
            || { echo "::error::axoupdater missing with self-update on" >&2; exit 1; }

  toolchain:
    name: toolchain (NFR-12 stable 1.96 --locked)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # A green stable build with the committed lock is the NFR-12 gate; fails if any crate needs
      # nightly-only features.
      - run: cargo build --workspace --locked

  audit:
    name: audit (cargo-audit advisories)
    # Supply-chain jobs are network-allowed by design (they fetch the advisory DB).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: deny (licenses, bans, sources, advisories)
    # Network-allowed by design. Single invocation covers all four check sets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check

  run-report-gate:
    name: run-report-gate (.knowledge run-report on substantive PRs)
    # Decision 7(ii): a substantive PR must carry its wiki run-report in the SAME diff. The predicate is
    # STRUCTURAL (scripts/knowledge/run-report-gate.sh — the same file the pr-create hook runs): no label,
    # no manual bypass. Dependabot is exempt by machine identity keyed on the PR AUTHOR login (immutable
    # PR metadata — github.actor would flip to whoever re-triggers CI on a bot PR and deadlock the
    # required check); its skipped required check counts as success. Spec: ci-cd-and-distribution.md §2.3.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0   # full history so merge-base(origin/<base>, HEAD) resolves
      - name: run-report gate (shared predicate)
        run: scripts/knowledge/run-report-gate.sh "origin/${GITHUB_BASE_REF}"
