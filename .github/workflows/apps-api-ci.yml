# apps-api-ci.yml — Greta-gate CI for the apps/api/ Encore Go backend.
#
# Source of truth for the gate set: docs/specs/01-spec-backend-mvp.md
# §11.2 NFR-10 (post-round-11 split shape). Bead unblock-tv8.6 is the
# canonical owner of this workflow.
#
# Gate composition (each line is a separate GitHub Actions step so the
# Checks-tab report row identifies which gate failed without parsing
# logs):
#
#   1. go fmt ./...          (zero diffs)
#   2. go vet ./...
#   3. golangci-lint run     (custom-gcl binary — both project-local
#                             module-plugin analyzers must load)
#   4. encore check
#   5. encore test ./...     (NO -race — see round-11 changelog and
#                             https://github.com/encoredev/encore/issues/1943:
#                             encore-go's lazyTraceInit.initStream
#                             SIGSEGVs cross-platform under -race;
#                             leaf-package race coverage takes the place
#                             of an encore-side race signal.)
#   6. encore test ./shared/rbactest/...
#                             (Separate report row for the NFR-2
#                             RBAC final-gate matrix. Spec §10.1
#                             round-10 reassigns the release-blocking
#                             separate-report wiring from E-3 / tv8.25
#                             to this bead.)
#   7. go test -race ./shared/ulid/... ./shared/rbac/... ./shared/lint/...
#                             (Leaf packages whose init does NOT panic
#                             under the native Go toolchain — this step
#                             carries the gate's race signal per §11.2.)
#
# Toolchain pins:
#
#   - Runner: ubuntu-24.04. Round-11 spec changelog reproduced
#     encoredev/encore#1943 on this image — pinning matches the spec's
#     verified environment.
#   - Go: read from apps/api/go.mod via setup-go's `go-version-file`.
#     Today that resolves to 1.26.2; bumping go.mod auto-bumps CI.
#   - Encore CLI: v1.57.0 explicit pin. Round-11 spec changelog
#     identifies this as the reproduced-on CLI version; pinning
#     eliminates version skew between local dev and CI (Olive's tv8.56
#     evidence shows CLI version diffs change behaviour).
#   - golangci-lint: v2.7.2. Matches apps/api/.custom-gcl.yml `version:`
#     and apps/api/.golangci.yml line 36 narrative pin. v2 schema in
#     .golangci.yml mandates a v2 binary.
#
# Secrets (bead unblock-f6z — single committed source of truth):
#
#   `encore test` boots the local Encore emulator, which reads five
#   secrets declared in apps/api/auth/secrets.go (MemoryDEK,
#   APIKeyHMACSecret, GitHubOAuthClientID, GitHubOAuthClientSecret,
#   GitHubOAuthRedirectURI).
#   apps/api/mcp/transport.go fail-fasts at boot if APIKeyHMACSecret
#   is empty (tv8.56 closure 2026-05-15); auth/secrets.go init()
#   fail-fasts on the four auth secrets; every package importing them
#   would panic before any test runs without the values.
#
#   The non-prod placeholder values are committed ONCE at
#   apps/api/secrets.nonprod.cue (the SOURCE OF TRUTH). CI copies that
#   file to apps/api/.secrets.local.cue ahead of any `encore test`
#   invocation (the SoT is already valid CUE in the exact shape Encore
#   expects). The destination is .gitignored
#   (apps/api/.gitignore "/.secrets.local.cue") so copying it in CI
#   leaves no trace. These are NEVER production credentials — they are
#   deterministic, public placeholders safe to commit and log.
#
#   This REVERSES tv8.67's split GitHub `CI_*` repo-secret registry:
#   there are no `${{ secrets.CI_* }}` reads and no `${VAR:-default}`
#   fallbacks here anymore. A missing/mismatched secret can no longer be
#   masked into a green build — the drift-check gate below catches a
#   secrets.go field that is absent from the SoT at PR time.
#
#   HONESTY / BOUNDARY: CI runs against the LOCAL emulator only (it
#   unlinks encore.app via `echo '{}' > encore.app`, so it has no
#   platform auth). The drift-check therefore validates
#   secrets.go ↔ secrets.nonprod.cue ONLY. It CANNOT see the Encore
#   Platform secret matrix. Platform parity (prod/dev/local/pr) relies
#   on apps/api/scripts/secrets-provision.sh + the SECRETS.md runbook +
#   the deploy-time boot fail-fast — not on this workflow.
#
# Catalogue-drift workflow:
#
#   .github/workflows/catalogue-drift.yml is the no-op P01 scaffold
#   owned by bead unblock-tv8.22 (D-7). This workflow does NOT touch
#   it — bead AC #3 ("catalogue-drift.yml is present but exits 0
#   unconditionally in P01") is satisfied by the existing file's
#   shape; A-6 must not regress it. The two workflows have disjoint
#   `paths:` filters and run independently.

name: apps-api-ci

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/apps-api-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/apps-api-ci.yml'
  workflow_dispatch:

# Cancel superseded runs on the same PR to save minutes. Push-to-main
# runs are NOT cancelled (each merge is a separate event of record).
concurrency:
  group: apps-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  greta-gate:
    name: greta-gate (apps/api)
    # ubuntu-24.04 matches the spec round-11 reproduction platform for
    # encoredev/encore#1943. Docker daemon ships preinstalled and
    # running, which `encore test`'s emulator (Postgres + Pub/Sub +
    # Cron containers) needs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    env:
      # Encore CLI version pin. Sourced once here, consumed by the
      # install step below. Bump in lockstep with the encore.dev
      # library version in apps/api/go.mod when the library bumps.
      #
      # NO leading 'v' — the upstream install.sh constructs the
      # download URL as
      #   https://d2f391esomvqpi.cloudfront.net/encore-${version}-${target}.tar.gz
      # and the published artifacts at that CDN are named without
      # the 'v' prefix (script's own example uses '1.50.0'). Passing
      # 'v1.57.0' yields a 403 and the install fails before any gate
      # step runs.
      ENCORE_CLI_VERSION: 1.57.0
      # golangci-lint version pin. MUST equal apps/api/.custom-gcl.yml
      # `version:` and apps/api/.golangci.yml line 36 narrative pin.
      #
      # v2.7.2 (NOT v2.5.0): v2.5.0 ships a `golangci-lint custom`
      # builder that calls
      #   git clone … -c " advice.detachedHead=false" -q …
      # — i.e. it passes the `-c key=value` pair as a single argument
      # with a leading space inside the key. git 2.54+ (the version
      # on ubuntu-24.04 runners as of April 2026) rejects this with
      # 'error: invalid key:  advice.detachedHead / fatal: unable to
      # write parameters to config file', surfacing as bare 'git
      # clone … exit status 128' because the `-q` flag swallowed
      # stderr. Fixed upstream in commit 101ccaca ('fix: clone args
      # used by custom command' PR #6206), first released in v2.7.0.
      # Bumping to v2.7.2 (minimum-viable patch line containing the
      # fix) keeps the linter policy stable while unblocking CI.
      GOLANGCI_LINT_VERSION: v2.7.2
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # Do NOT persist the auto-injected GITHUB_TOKEN extraheader
          # in this repo's local git config. `golangci-lint custom`
          # invokes `git clone https://github.com/golangci/golangci-lint`
          # in a temp dir during its build step; when the workspace
          # checkout leaves an `http.https://github.com/.extraheader`
          # behind, that header leaks into the custom build's clone
          # and GitHub returns 401, surfacing as `git clone … exit
          # status 128`. Disabling persistence keeps the workflow
          # auth-clean for sub-process git operations.
          persist-credentials: false

      - name: setup-go
        uses: actions/setup-go@v5
        with:
          # Resolve toolchain from apps/api/go.mod (today: 1.26.2).
          # Resilient to future Go bumps without editing this file.
          go-version-file: apps/api/go.mod
          # Default cache key keys off go.sum, which is sufficient for
          # apps/api's single-module workspace.
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: install encore cli
        # No upstream `encoredev/setup-encore` GitHub Action exists
        # (verified across the repo and ENCORE.md). The official install
        # path is `curl -L https://encore.dev/install.sh | bash`, but that
        # pipes a live, mutable script from Encore's CDN into a shell —
        # the moving supply-chain surface tv8.67 set out to eliminate.
        # encore.dev/install.sh is NOT a GitHub-hosted file (served as
        # application/x-sh from Encore's own site), so there is no commit
        # SHA to pin it against the way we pin golangci-lint's installer.
        # We therefore VENDOR the installer at .github/scripts/encore-install.sh
        # (captured 2026-06-01; upstream sha256
        # 3e8344b509dac145165498c53aeb4b9eaeac050eaeab404cbca86014b27f4ba5)
        # and run the committed, reviewable copy. The CLI *binary* version
        # is still pinned via the ${ENCORE_CLI_VERSION} argument — the
        # script consumes it to build the exact CloudFront tarball URL.
        # Refresh procedure is documented in the vendored script header.
        run: |
          bash .github/scripts/encore-install.sh "${ENCORE_CLI_VERSION}"
          echo "${HOME}/.encore/bin" >> "${GITHUB_PATH}"
        # Sanity-check the install succeeded and the pinned version
        # landed before any consumer step runs.
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: verify encore cli version
        run: encore version
        working-directory: ${{ github.workspace }}

      - name: unlink encore.app from cloud project for CI
        # The committed apps/api/encore.app links the workspace to the
        # Encore Cloud app `unblock-sco2`. With that linkage, every
        # `encore check` / `encore test` invocation attempts to fetch
        # secrets from https://api.encore.cloud/apps/unblock-sco2/
        # secrets:values?kind=development BEFORE merging the local
        # .secrets.local.cue overrides — and on a fresh GHA runner
        # there is no logged-in user, so the fetch fails with
        # 'not logged in: run encore auth login first' and the app
        # never finishes starting up.
        #
        # CI gates only ever exercise the LOCAL emulator (Postgres +
        # Pub/Sub + Cron in containers) with placeholder secrets. We
        # do NOT need cloud-side secrets to validate the build; the
        # `.secrets.local.cue` written in the next step is the sole
        # source of secret values for the run. Replacing encore.app
        # with `{}` detaches the CI run from the cloud project for
        # the duration of this job; the original file on disk lives
        # only on the runner (never committed, never persisted past
        # job cleanup), so this is safe.
        #
        # Path forward when cloud-side validation is desired (e.g.
        # preview-environment deploys for PRs): add an
        # ENCORE_AUTH_KEY repo secret (generated from Encore Cloud
        # dashboard, https://encore.dev/docs/platform/integrations/
        # auth-keys) and call `encore auth login --auth-key=...`
        # before the gate steps instead of unlinking. P01 scope is
        # local-emulator gates only, so the unlink path is the
        # minimal surface needed today.
        run: |
          echo '{}' > encore.app

      - name: secrets SoT drift-check (all apps/api secret structs ↔ secrets.nonprod.cue)
        # Bead unblock-f6z deliverable #4 (+ follow-ups: BIDIRECTIONAL, then
        # ALL-PACKAGES). Assert an EXACT BIJECTION between the UNION of the
        # fields of EVERY `var secrets struct` declared anywhere in apps/api
        # and the keys of the committed source of truth,
        # apps/api/secrets.nonprod.cue. Two failure modes, BOTH a hard FAIL
        # (no soft warnings — an ignorable check would re-open the same
        # false-green gap that crashed the deploy):
        #   Direction 1 (comm -23): a declared field MISSING from the SoT —
        #     "added the Go field + boot guard but forgot to provision" (the
        #     failure mode that left GitHubOAuthRedirectURI unprovisioned and
        #     crashed the deploy).
        #   Direction 2 (comm -13): a SoT key NOT declared in ANY struct —
        #     a STALE/EXTRA SoT entry (e.g. a placeholder left behind after a
        #     Go secret was removed). This would silently over-provision a
        #     dead secret and rot the SoT.
        #
        # WHY THE UNION OF ALL PACKAGES, not just auth/secrets.go: SPEC §3.5
        # treats auth as the canonical consumer that SHOULD declare the
        # superset, and today it does (mcp/cursor.go, exitcriteriontest/
        # secrets.go, perftest/secrets.go each declare only the
        # APIKeyHMACSecret subset). But "auth is the superset" is an
        # INVARIANT we must ENFORCE, not assume: if a future secret were added
        # to a non-auth struct ONLY (e.g. an mcp-only secret) and not to auth,
        # parsing auth alone would make it invisible to BOTH the SoT and this
        # check — re-opening a narrower version of the masking gap. Discovering
        # every struct and unioning closes that hole: any secret declared
        # anywhere in apps/api must have a SoT placeholder, period. NB: the
        # superset invariant itself (every non-auth field ⊆ auth) is NOT
        # asserted here — the bijection guarantees union ↔ SoT, which is the
        # property that actually prevents an unprovisioned secret.
        #
        # DISCOVERY (robust, package-agnostic): we do NOT hardcode the four
        # files known today. We walk every NON-`_test.go` Go file under
        # apps/api and, per file, awk out the fields inside each
        # `var secrets struct { … }` block, then sort -u the union. Scoping to
        # non-`_test.go` files avoids picking up mock/fixture structs from unit
        # tests; the four real secret structs (auth, mcp, exitcriteriontest,
        # perftest) all live in plain `.go` files (the *test packages are
        # Encore test-HELPER packages on the normal build path, not `_test.go`
        # files), so they are correctly in scope. If a legitimate secret is
        # ever declared in a `_test.go` file, this check would not see it —
        # declare Encore secrets in a non-`_test.go` file (the existing
        # convention) so the boot guards and this gate both apply.
        #
        # BOUNDARY (honest scope): this validates the code ↔ SoT contract
        # ONLY. It does NOT and CANNOT validate the Encore Platform secret
        # matrix — CI unlinks encore.app and has no platform auth. Platform
        # parity is enforced by scripts/secrets-provision.sh + SECRETS.md +
        # the deploy-time boot fail-fast.
        #
        # Extraction is text-based (no Go build needed, runs before any
        # compile step):
        #   - struct fields: leading PascalCase identifier of each
        #     `<Field> string` line inside any `var secrets struct { … }`
        #     block, unioned across every discovered file.
        #   - SoT fields: leading identifier of each `<Field>: "…"` line
        #     (comment lines start with `//` and never match).
        run: |
          # Union the fields of every `var secrets struct` across all
          # non-_test.go Go files under apps/api. -print0/-0 is filename-safe;
          # awk receives many files and resets its in-block flag per file via
          # FNR==1 so a struct left "open" at EOF cannot bleed into the next.
          go_fields="$(find . -type f -name '*.go' ! -name '*_test.go' -print0 \
            | xargs -0 awk '
                FNR==1                  { f=0 }
                /^var secrets struct \{/ { f=1; next }
                f && /^\}/              { f=0 }
                f && /^[[:space:]]+[A-Z][A-Za-z0-9_]*[[:space:]]+string/ { print $1 }
              ' \
            | sort -u)"

          sot_fields="$(grep -oE '^[A-Za-z_][A-Za-z0-9_]*[[:space:]]*:[[:space:]]*"[^"]*"' \
            secrets.nonprod.cue | sed -E 's/[[:space:]]*:.*//' | sort -u)"

          if [ -z "${go_fields}" ]; then
            echo "::error::could not parse any fields from any 'var secrets struct' under apps/api"
            exit 1
          fi

          fail=0

          # Direction 1: every declared field MUST be present in the SoT.
          missing="$(comm -23 <(printf '%s\n' "${go_fields}") <(printf '%s\n' "${sot_fields}"))"
          if [ -n "${missing}" ]; then
            echo "::error::a 'var secrets struct' under apps/api declares fields absent from apps/api/secrets.nonprod.cue:"
            echo "${missing}"
            echo "Add a placeholder line for each to secrets.nonprod.cue and run scripts/secrets-provision.sh (see apps/api/SECRETS.md)."
            fail=1
          fi

          # Direction 2: every SoT key MUST be declared in some struct.
          extra="$(comm -13 <(printf '%s\n' "${go_fields}") <(printf '%s\n' "${sot_fields}"))"
          if [ -n "${extra}" ]; then
            echo "::error::apps/api/secrets.nonprod.cue declares keys absent from every 'var secrets struct' under apps/api:"
            echo "${extra}"
            echo "Remove the stale placeholder line(s) from secrets.nonprod.cue, or add the missing field + boot guard to a service's secret struct (see apps/api/SECRETS.md)."
            fail=1
          fi

          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "secrets SoT drift-check OK — exact bijection: all $(printf '%s\n' "${go_fields}" | grep -c .) declared secret field(s) (unioned across every apps/api secret struct) ↔ secrets.nonprod.cue key(s)"

      - name: provision local secrets for encore emulator
        # Bead unblock-f6z: the local emulator needs the five secrets
        # declared at apps/api/auth/secrets.go to be non-empty (mcp/
        # transport.go fail-fasts on APIKeyHMACSecret == ""; auth/
        # secrets.go init() fail-fasts on the four auth secrets). The
        # values come from the SINGLE committed source of truth,
        # apps/api/secrets.nonprod.cue, which is already valid CUE in the
        # exact `<GoField>: "<value>"` shape Encore expects — so we copy
        # it verbatim to the .gitignored .secrets.local.cue. No CI_*
        # GitHub secrets, no `${VAR:-default}` fallback, no inline
        # plaintext: one source of truth, zero masking. The destination
        # is .gitignored and NEVER persisted past the runner.
        run: |
          cp secrets.nonprod.cue .secrets.local.cue

      # ------------------------------------------------------------------
      # Gate 1 — go fmt
      # ------------------------------------------------------------------
      - name: go fmt (zero diffs)
        # `go fmt ./...` exits 0 even when it rewrites files; the diff
        # is what we want to assert against. Capture its stdout and
        # fail if any path was rewritten.
        run: |
          changed="$(gofmt -l .)"
          if [ -n "${changed}" ]; then
            echo "::error::gofmt would rewrite the following files:"
            echo "${changed}"
            exit 1
          fi

      # ------------------------------------------------------------------
      # Gate 2 — go vet
      # ------------------------------------------------------------------
      - name: go vet
        run: go vet ./...

      # ------------------------------------------------------------------
      # Gate 3 — golangci-lint (custom binary)
      #
      # Per orchestrator DECISION 2026-05-26 on bead unblock-tv8.6,
      # stock golangci-lint is NOT acceptable: P01 must gate the two
      # project-local module-plugin analyzers
      # (no_direct_is_ready_write, no_rbac_dynamic_clause) that guard
      # SPEC §11.3 invariants. `golangci-lint custom` reads
      # apps/api/.custom-gcl.yml and emits ./custom-gcl with both
      # analyzers compiled in.
      # ------------------------------------------------------------------
      - name: install golangci-lint
        # Official install script — pinned to a commit SHA, NOT `master`
        # (tv8.67 supply-chain hygiene). Previously this curled
        #   raw.githubusercontent.com/golangci/golangci-lint/master/install.sh
        # which re-fetches whatever HEAD of master happens to be at run
        # time — a moving, attacker-influenceable surface for PRs from
        # forks. We pin to the install.sh as it shipped at the v2.7.2 tag
        # commit 9f61b0f53f80672872fced07b6874397c3ed197b (the v2.7.2 tag
        # is a lightweight tag pointing directly at that commit; verified
        # 2026-06-01). The script still takes the same `[-b <bindir>]
        # <tag>` arguments, so it downloads the GOLANGCI_LINT_VERSION
        # release tarball exactly as before — only the script's own
        # provenance is now frozen.
        #
        # The binary version pin (${GOLANGCI_LINT_VERSION} = v2.7.2) MUST
        # match the `version:` field of apps/api/.custom-gcl.yml so the
        # schema (declared `version: "2"` in apps/api/.golangci.yml) and
        # the binary used to build custom-gcl stay consistent. Keep this
        # commit SHA in lockstep with GOLANGCI_LINT_VERSION on any bump.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/9f61b0f53f80672872fced07b6874397c3ed197b/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
        working-directory: ${{ github.workspace }}

      - name: build custom-gcl (loads project-local analyzers)
        # `golangci-lint custom` reads .custom-gcl.yml from the current
        # working directory; the recipe under apps/api/.custom-gcl.yml
        # builds the binary to ./custom-gcl (its `destination: .` plus
        # `name: custom-gcl`).
        #
        # `-v` (verbose) is essential in CI: the underlying `git clone`
        # is invoked with `-q` by golangci-lint so any clone failure
        # otherwise surfaces only as a bare `exit status 128` with no
        # stderr. Verbose mode reveals the actual git error message
        # for diagnosis.
        #
        # `GIT_TERMINAL_PROMPT=0` prevents git from blocking on an
        # interactive credential prompt if the clone unexpectedly hits
        # a 401 — fail fast instead of timing out the runner.
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: golangci-lint custom -v

      - name: golangci-lint run (custom-gcl)
        # SPEC §11.2 NFR-10 says `golangci-lint run --max-warnings 0`.
        # That flag exists only on golangci-lint v1.x; in v2 (the
        # binary the v2 schema in apps/api/.golangci.yml mandates)
        # the equivalent semantics are native — any issue exits 1
        # and `max-issues-per-linter: 0` + `max-same-issues: 0` in
        # apps/api/.golangci.yml (lines 116-117) disable the
        # truncation that previously made `--max-warnings 0` a
        # required addition. No flag substitution needed: a clean
        # run still exits 0; any issue still exits 1.
        run: ./custom-gcl run

      # ------------------------------------------------------------------
      # Gate 4 — encore check
      # ------------------------------------------------------------------
      - name: encore check
        # Encore-specific static analysis (RPC signatures, secret
        # declarations, Pub/Sub topic registrations, etc.). Runs
        # before any test step so any structural break is reported
        # before Docker spends time booting the emulator.
        run: encore check

      # ------------------------------------------------------------------
      # Gate 5 — encore test ./...
      #
      # Boots Postgres + Pub/Sub + Cron emulators automatically.
      # NO -race per round-11 (encoredev/encore#1943 SIGSEGV).
      # ------------------------------------------------------------------
      - name: encore test (full suite)
        run: encore test ./...

      # ------------------------------------------------------------------
      # Gate 6 — RBAC suite separate report
      #
      # Per SPEC §10.1 round-10 closure, the release-blocking
      # NFR-2 RBAC final-gate is owned by A-6 (this bead) — invoke
      # the rbactest package as its own step so a regression here
      # shows up as a discrete Checks-tab row labelled "rbac-suite".
      # ------------------------------------------------------------------
      - name: encore test (rbac-suite, separate report)
        run: encore test ./shared/rbactest/...

      # ------------------------------------------------------------------
      # Gate 7 — leaf-package race coverage
      #
      # `go test -race` on three packages whose init does NOT panic
      # under the native toolchain (no Encore framework imports that
      # touch sqldb.NewDatabase / pubsub.NewTopic at package init).
      # This is where the gate's race signal lives — see round-11.
      # ------------------------------------------------------------------
      - name: go test -race (leaf packages)
        run: go test -race ./shared/ulid/... ./shared/rbac/... ./shared/lint/...

      # ------------------------------------------------------------------
      # Gate 8 — NFR-1 latency harness (ISOLATED, advisory)
      #
      # Owner: bead unblock-tv8.24 (E-2). Authoritative contract:
      # docs/specs/01-spec-backend-mvp.md §11.2 NFR-1 "Test isolation
      # (round-15)" + "Gate semantics" paragraphs.
      #
      # WHY A DEDICATED ISOLATED STEP (round-15 CI-failure closure,
      # CI run 26633703926):
      #   A latency harness CANNOT co-schedule with the full functional
      #   suite (Gate 5, `encore test ./...`) on a single shared local
      #   Postgres and produce meaningful numbers or a reliable verdict.
      #   Under concurrent load the warm-cache Validate/Claim/Ready calls
      #   ballooned from a local ~87 ms p99 to 5-16 s, and one
      #   measurement-loop response returned an empty body that tripped a
      #   transport-level t.Fatalf the gate does not guard. The harness
      #   therefore runs ALONE in this step, never co-scheduled with the
      #   other apps/api packages. Gate 5 stays unchanged: with
      #   UNBLOCK_PERF_GATE unset, perftest's TestMain short-circuits
      #   (os.Exit(0) before SeedFixture and m.Run()) so the default
      #   suite carries zero perftest DB load and zero mcp.tool_calls
      #   rows — see Greta's isolation DECISION on the bead.
      #
      # EXACT COMMAND (Greta's empirically-validated infra contract):
      #   UNBLOCK_PERF_GATE=1 encore test ./perftest/...
      #   - UNBLOCK_PERF_GATE=1 BOTH admits the package into the run (the
      #     TestMain gate) AND arms the p99 (< 2 s) and goroutine-drain
      #     (drained - baseline <= 20) hard-fail assertions.
      #   - NO `-tags=perf`: the build-tag mechanism was rejected because
      #     `-tags=perf` does NOT propagate to Encore's generated
      #     runtime-shim packages, breaking the whole-app build with
      #     `undefined: rlog.Error` / `undefined: __encore_secrets.Load`.
      #     Encore's codegen overlay does not apply custom Go build tags.
      #
      # WHY ADVISORY (continue-on-error: true), NOT release-blocking:
      #   Spec §11.2 NFR-1 "Gate semantics" states verbatim:
      #   "Release-blocking pipeline wiring is a P02 ops item owned by
      #   Olive." The round-15 isolation paragraph mandates ONLY that the
      #   harness run in a dedicated isolated step under
      #   UNBLOCK_PERF_GATE=1 — it does NOT promote the budget to a merge
      #   blocker. Empirically the 2 s budget is environment-sensitive
      #   (risk R5 on the bead): GH Actions free-tier shared runners can
      #   be 2-3x slower than a dev laptop, so a transient noisy-neighbour
      #   spike could breach 2 s with no real regression and wrongly block
      #   an unrelated merge. continue-on-error keeps the verdict visible
      #   as its own Checks-tab row (the JSON-Lines samples + p99 +
      #   goroutine deltas are always logged via t.Logf, and a budget
      #   breach turns the step red) while leaving the merge gate to the
      #   P02 ops promotion. Reuses this job's emulator setup (Postgres +
      #   Docker, the .secrets.local.cue placeholders, the unlinked
      #   encore.app) — no second job spins the cluster up again.
      # ------------------------------------------------------------------
      - name: encore test (NFR-1 latency harness, isolated, advisory)
        continue-on-error: true
        env:
          UNBLOCK_PERF_GATE: "1"
        run: encore test ./perftest/...
